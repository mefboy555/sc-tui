<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>scplay — вход</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: grid; place-items: center; }
    .auth-box {
      background: var(--panel); padding: 2rem; border-radius: var(--radius);
      width: 340px; border: 1px solid var(--border);
    }
    .auth-box h1 { margin: 0 0 1rem; font-size: 1.2rem; text-align: center; }
    .tabs { display: flex; gap: .5rem; margin-bottom: 1.2rem; }
    .tabs button {
      flex: 1; padding: .5rem; background: none;
      border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; cursor: pointer;
    }
    .tabs button.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .auth-box label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .3rem; }
    .auth-box input {
      width: 100%; padding: .6rem .8rem; margin-bottom: 1rem;
      background: var(--panel2); border: 1px solid #2c2c3a;
      border-radius: 8px; color: var(--text); outline: none;
    }
    .auth-box button[type=submit] {
      width: 100%; padding: .7rem;
      background: var(--accent); color: #fff; border: 0;
      border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .err { color: #ff6b6b; font-size: .85rem; margin-bottom: 1rem; min-height: 1em; }
  </style>
</head>
<body>
  <form class="auth-box" id="authform">
    <h1>🎵 scplay.web</h1>
    <div class="tabs">
      <button type="button" data-mode="login" class="active">Вход</button>
      <button type="button" data-mode="register">Регистрация</button>
    </div>
    <label for="f-login">Логин</label>
    <input id="f-login" name="username" required minlength="3" maxlength="32" autofocus autocomplete="username">
    <label for="f-pass">Пароль</label>
    <input id="f-pass" name="password" type="password" required minlength="4" maxlength="128" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button type="submit" id="submit">Войти</button>
  </form>
  <script src="/login.js"></script>
</body>
</html>
